<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de prévias</title>
<style>
@font-face{font-family:"Public Sans";src:url(/assets/fonts/public-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--fundo:#F2F3F2;--tinta:#1A1F22;--suave:#5A6264;--linha:#D5D8D6;--cor:#2F4A3F;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;accent-color:var(--cor)}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.5}
::selection{background:var(--cor);color:#fff}
.app{display:grid;grid-template-columns:440px 1fr;height:100vh}
.painel{overflow-y:auto;padding:28px 28px 120px;background:#fff}
h1{font-size:24px;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--suave);margin-bottom:24px}
h2{font-size:13px;font-weight:700;color:var(--suave);margin:28px 0 12px}
label{display:block;font-weight:600;margin-bottom:12px}
label small{display:block;font-weight:400;color:var(--suave);font-size:13px;margin-top:2px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid var(--linha);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:inherit;caret-color:var(--cor)}
textarea{resize:vertical;min-height:84px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
input[type=color]{height:42px;padding:4px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}.chk input{width:auto;margin:0}
.barra{position:sticky;bottom:-120px;margin:28px -28px -120px;padding:16px 28px 28px;background:#fff;box-shadow:0 -1px 0 var(--linha);display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:13px 18px;border-radius:8px;border:0;background:var(--cor);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:filter .2s ease,transform .16s var(--ease)}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.sec{background:#E6E9E7;color:var(--tinta)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{font-size:13px;color:var(--suave);word-break:break-all}
.link a{color:var(--cor)}
.aviso{font-size:13px;color:#8A2D1B;min-height:1em}
.ver{position:relative;background:#D9DCDA;display:flex;flex-direction:column}
.ver .tabs{display:flex;gap:6px;padding:10px 14px;justify-content:center}
.ver .tabs button{padding:7px 14px;border-radius:999px;border:0;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--tinta)}
.ver .tabs button[aria-pressed=true]{background:var(--tinta);color:#fff}
.moldura{flex:1;display:flex;justify-content:center;padding:0 14px 14px;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px;transition:width .3s var(--ease)}
.cel iframe{width:390px}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}.ver{height:80vh}.barra{position:static;margin:28px 0 0;padding:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<form class="painel" id="f" onsubmit="return false">
  <h1>Gerador de prévias</h1>
  <p class="sub">Preencha com os dados do Google Maps. A prévia ao lado atualiza na hora.</p>

  <h2>Empresa</h2>
  <label>Nome da empresa<input name="nome" required placeholder="Ex: Vidraçaria Podium"></label>
  <label>Ramo<small>Aparece no topo e no título, ex: Vidraçaria, Estofaria, Oficina mecânica</small><input name="ramo" placeholder="Vidraçaria"></label>
  <div class="linha3"><label>Cidade<input name="cidade" placeholder="Campinas"></label><label>UF<input name="uf" maxlength="2" placeholder="SP"></label><label>Nota<input name="nota" inputmode="decimal" placeholder="4,9"></label></div>
  <div class="linha2"><label>WhatsApp<input name="whatsapp" inputmode="tel" placeholder="(19) 99999-9999"></label><label>Nº de avaliações<input name="avaliacoes" inputmode="numeric" placeholder="120"></label></div>
  <label>Endereço<small>Rua, número e bairro. A cidade entra sozinha.</small><input name="endereco" placeholder="R. Exemplo, 123, Centro"></label>
  <label>Horário<small>Uma linha por período</small><textarea name="horario" rows="2" placeholder="Seg a sex, 8h às 18h&#10;Sábado, 8h às 12h"></textarea></label>

  <h2>Visual</h2>
  <div class="linha2">
    <label>Estilo<select name="tema" id="tema"></select></label>
    <label>Cor principal<input type="color" name="cor" value="#2F4A3F"></label>
  </div>

  <h2>Textos</h2>
  <label>Título grande (opcional)<small>Curto, até 2 linhas. Vazio = "Ramo em Cidade."</small><input name="titulo" maxlength="70"></label>
  <label>Frase abaixo do título (opcional)<input name="subtitulo" maxlength="180"></label>
  <label>Serviços<small>Um por linha: Nome | descrição curta</small><textarea name="servicos" rows="4" placeholder="Box para banheiro | Vidro temperado sob medida&#10;Espelhos | Corte e instalação"></textarea></label>
  <label>Opções no pedido de orçamento (opcional)<small>Separadas por vírgula. Vazio usa os serviços.</small><input name="opcoes" placeholder="Box, Espelho, Janela ou porta, Outro"></label>
  <label>Como funciona (opcional)<small>Até 4 etapas, uma por linha: Nome | descrição. Vazio usa um padrão neutro.</small><textarea name="passos" rows="3"></textarea></label>
  <label>Avaliações do Google<small>Copie e cole palavra por palavra, uma por linha. Nunca invente.</small><textarea name="depoimentos" rows="5"></textarea></label>
  <label>Perguntas frequentes (opcional)<small>Uma por linha: Pergunta | Resposta. Só o que a empresa confirma.</small><textarea name="faq" rows="3"></textarea></label>

  <h2>Fotos</h2>
  <label>Links das fotos<small>Uma por linha: link | legenda. A primeira vai no topo. Use de 3 a 6.</small><textarea name="fotos" rows="4" placeholder="https://images.unsplash.com/photo-...?w=1600 | Box de vidro"></textarea></label>
  <label>Crédito das fotos<input name="creditoFotos" value="Fotos ilustrativas: Unsplash"></label>
  <label class="chk"><input type="checkbox" name="oficial"> Site oficial (tira o aviso de prévia)</label>

  <div class="barra">
    <p class="aviso" id="aviso"></p>
    <button class="btn" type="button" id="pub">Publicar prévia no GitHub</button>
    <div class="duas"><button class="btn sec" type="button" id="baixar">Baixar arquivo</button><button class="btn sec" type="button" id="abrir">Abrir arquivo</button></div>
    <p class="link" id="link"></p>
    <input type="file" id="arq" accept="application/json" hidden>
  </div>
</form>
<div class="ver">
  <div class="tabs" role="group" aria-label="Tamanho da prévia"><button type="button" data-v="pc" aria-pressed="true">Computador</button><button type="button" data-v="cel" aria-pressed="false">Celular</button></div>
  <div class="moldura" id="mold"><iframe id="pv" title="Prévia do site"></iframe></div>
</div>
</div>
<script type="module">
import { pagina, TEMAS } from "/assets/render.js";
const REPO = "bryanshenayder/demos-sites", PASTA = "previas/clientes";
const f = document.getElementById("f"), pv = document.getElementById("pv"), sel = document.getElementById("tema");
Object.entries(TEMAS).forEach(([k, t]) => sel.insertAdjacentHTML("beforeend", `<option value="${k}">${t.nome}</option>`));
const linhas = (s) => s.split("\n").map((l) => l.trim()).filter(Boolean);
const pares = (s, a, b) => linhas(s).map((l) => { const [x, ...y] = l.split("|"); return { [a]: x.trim(), [b]: y.join("|").trim() }; });
const slugify = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function dados() {
  const v = Object.fromEntries(new FormData(f));
  const d = {
    nome: v.nome.trim(), ramo: v.ramo.trim(), cidade: v.cidade.trim(), uf: v.uf.trim().toUpperCase(),
    whatsapp: v.whatsapp.trim(), endereco: v.endereco.trim(), horario: linhas(v.horario),
    nota: v.nota.trim(), avaliacoes: v.avaliacoes.trim(), tema: v.tema, cor: v.cor,
    titulo: v.titulo.trim(), subtitulo: v.subtitulo.trim(),
    servicos: pares(v.servicos, "nome", "desc"), passos: pares(v.passos, "nome", "desc"),
    depoimentos: linhas(v.depoimentos), faq: pares(v.faq, "p", "r"),
    fotos: pares(v.fotos, "url", "legenda").filter((x) => /^https?:\/\//.test(x.url)),
    creditoFotos: v.creditoFotos.trim(), oficial: !!v.oficial,
  };
  const op = v.opcoes.split(",").map((x) => x.trim()).filter(Boolean); if (op.length) d.orcamento = { opcoes: op };
  Object.keys(d).forEach((k) => (d[k] === "" || (Array.isArray(d[k]) && !d[k].length)) && delete d[k]);
  return d;
}
function preenche(d) {
  const j = (a, x, y) => (a || []).map((o) => (y ? `${o[x]}${o[y] ? " | " + o[y] : ""}` : o)).join("\n");
  const map = { ...d, horario: j(d.horario), servicos: j(d.servicos, "nome", "desc"), passos: j(d.passos, "nome", "desc"), depoimentos: j(d.depoimentos), faq: j(d.faq, "p", "r"), fotos: j(d.fotos, "url", "legenda"), opcoes: ((d.orcamento || {}).opcoes || []).join(", ") };
  for (const el of f.elements) { if (!el.name || !(el.name in map)) continue; if (el.type === "checkbox") el.checked = !!map[el.name]; else el.value = map[el.name] ?? ""; }
}
let t;
function render() {
  clearTimeout(t);
  t = setTimeout(() => {
    const d = dados();
    try { localStorage.setItem("gerador-rascunho", JSON.stringify(d)); } catch (_) {}
    const y = pv.contentWindow ? pv.contentWindow.scrollY : 0;
    pv.srcdoc = pagina({ nome: "Nome da empresa", ...d }, { assets: "/assets/", previa: !d.oficial });
    pv.onload = () => { try { pv.contentWindow.scrollTo(0, y); } catch (_) {} };
    const s = slugify(d.nome || "");
    document.getElementById("link").innerHTML = s ? `Link depois de publicar: <a href="/${s}" target="_blank" rel="noopener">${location.origin}/${s}</a>` : "";
    const falta = [];
    if (!d.nome) falta.push("nome"); if (!d.whatsapp) falta.push("WhatsApp"); if (!(d.fotos || []).length) falta.push("ao menos 1 foto");
    document.getElementById("aviso").textContent = falta.length ? "Falta: " + falta.join(", ") + "." : "";
  }, 250);
}
f.addEventListener("input", render);
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  document.getElementById("mold").classList.toggle("cel", b.dataset.v === "cel");
}));
document.getElementById("pub").addEventListener("click", () => {
  const d = dados(); if (!d.nome) { f.nome.focus(); return; }
  const s = slugify(d.nome), txt = JSON.stringify(d, null, 2);
  const url = `https://github.com/${REPO}/new/main/${PASTA}?filename=${encodeURIComponent(s + ".json")}&value=${encodeURIComponent(txt)}&message=${encodeURIComponent("Prévia: " + d.nome)}`;
  window.open(url, "_blank", "noopener");
});
document.getElementById("baixar").addEventListener("click", () => {
  const d = dados(), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: "application/json" }));
  a.download = (slugify(d.nome || "empresa") || "empresa") + ".json"; a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById("abrir").addEventListener("click", () => document.getElementById("arq").click());
document.getElementById("arq").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try { preenche(JSON.parse(await file.text())); render(); } catch (_) { document.getElementById("aviso").textContent = "Esse arquivo não é de uma prévia."; }
});
try { const r = localStorage.getItem("gerador-rascunho"); if (r) preenche(JSON.parse(r)); } catch (_) {}
render();
</script>
</body>
</html>
